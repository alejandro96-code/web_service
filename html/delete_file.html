<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv - Eliminar Archivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">🗑️ Eliminar Archivos</h3>
                <p class="mb-0 small">Gestiona los archivos subidos</p>
            </div>
            <div class="card-body">
                
                <!-- Lista de archivos disponibles -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">📁 Archivos disponibles:</h5>
                        <button class="btn btn-primary btn-sm" onclick="loadFiles()">🔄 Recargar</button>
                    </div>
                    <div class="card-body">
                        <div id="fileList">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                                <p>Cargando archivos...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <hr>                <!-- Navegación -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                    <a href="/" class="btn btn-secondary">🏠 Volver al inicio</a>
                    <a href="/formupload.html" class="btn btn-success">📤 Subir archivos</a>
                    <a href="/autoindex/" class="btn btn-info">📁 Ver autoindex</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function deleteFile(path, filename) {
            if (!confirm('¿Estás seguro de que quieres eliminar: ' + filename + '?')) {
                return;
            }

            // Crear formulario para enviar DELETE
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = path;
            
            const methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'DELETE';
            form.appendChild(methodInput);
            
            document.body.appendChild(form);
            form.submit();
        }

        async function loadFiles() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<div class="text-center"><div class="spinner-border text-primary"></div><p>Cargando...</p></div>';

            try {
                const response = await fetch('/autoindex/archivosSubidos/');
                const html = await response.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a[href]');
                
                const files = [];
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    const text = link.textContent.trim();
                    if (href && !href.endsWith('/') && text !== '..' && text !== '../') {
                        files.push({ name: text, path: href });
                    }
                });

                if (files.length === 0) {
                    fileList.innerHTML = '<div class="alert alert-info">📁 No hay archivos disponibles</div>';
                } else {
                    let listHtml = '<div class="list-group">';
                    files.forEach(file => {
                        listHtml += '<div class="list-group-item d-flex justify-content-between align-items-center">';
                        listHtml += '<span>📄 ' + file.name + '</span>';
                        listHtml += '<button class="btn btn-danger btn-sm" onclick="deleteFile(\'' + file.path + '\', \'' + file.name + '\')">🗑️ Eliminar</button>';
                        listHtml += '</div>';
                    });
                    listHtml += '</div>';
                    fileList.innerHTML = listHtml;
                }
            } catch (error) {
                fileList.innerHTML = '<div class="alert alert-danger">❌ Error al cargar archivos</div>';
            }
        }

        window.onload = () => { loadFiles(); };
    </script>
</body>
</html>
