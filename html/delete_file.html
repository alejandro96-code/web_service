<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv - Eliminar Archivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0">🗑️ Eliminar Archivos</h3>
            </div>
            <div class="card-body">
                <!-- Ver archivos disponibles -->
                <div class="alert alert-info">
                    <h5>📋 Archivos disponibles:</h5>
                    <p>Para ver la lista de archivos, ve a: <a href="/autoindex/archivosSubidos/" target="_blank">Ver archivos</a></p>
                </div>

                <!-- Formulario para eliminar -->
                <div class="card">
                    <div class="card-header">
                        <h5>Eliminar un archivo</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="/delete_file">
                            <div class="mb-3">
                                <label for="filename" class="form-label">Nombre del archivo a eliminar:</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="filename" 
                                       name="filename"
                                       placeholder="miarchivo.txt"
                                       required>
                                <small class="text-muted">Solo escribe el nombre del archivo (ej: archivo.txt)</small>
                            </div>
                            <input type="hidden" name="_method" value="DELETE">
                            <button type="submit" class="btn btn-danger">🗑️ Eliminar archivo</button>
                        </form>
                    </div>
                </div>

                <hr>
                <div class="d-grid gap-2 d-md-flex justify-content-md-between">
                    <a href="/" class="btn btn-secondary">🏠 Inicio</a>
                    <a href="/formupload.html" class="btn btn-success">📤 Subir archivos</a>
                    <a href="/autoindex/" class="btn btn-info">📁 Autoindex</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
