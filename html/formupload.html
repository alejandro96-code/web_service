<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv - Subir Archivos</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <style>
        .file-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }
     </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">📤 Subir Archivos</h1>
        
        <!-- Formulario de subida -->
        <div class="card mb-4">
            <div class="card-body">
                <form action="/autoindex" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="archivo" class="form-label">Selecciona un archivo:</label>
                        <input type="file" name="archivo" id="archivo" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-primary">📤 Subir</button>
                    <a href="/" class="btn btn-secondary">🏠 Volver al inicio</a>
                </form>
            </div>
        </div>

        <!-- Lista de archivos subidos -->
        <div class="card">
            <div class="card-header">
                <h5>📁 Archivos en archivosSubidos/</h5>
            </div>
            <div class="card-body">
                <iframe src="/autoindex/archivosSubidos/" 
                        width="100%" 
                        height="400" 
                        style="border: 1px solid #ddd; border-radius: 8px;">
                </iframe>
                <p class="text-muted mt-3">
                    💡 <strong>Para eliminar:</strong> Haz clic en un archivo del listado arriba, 
                    luego cambia en la URL del navegador <code>GET</code> por <code>DELETE</code> usando 
                    herramientas como Postman, curl, o usa la página de <a href="/delete_file.html">gestión de archivos</a>.
                </p>
                <a href="/delete_file.html" class="btn btn-danger">🗑️ Ir a eliminar archivos</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
