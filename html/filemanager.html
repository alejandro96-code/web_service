<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .file-item {
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">📁 File Manager</h1>
        
        <div class="alert alert-info">
            <strong>📤 Subir archivos:</strong> Usa el <a href="/formupload.html">formulario de upload</a>
        </div>
        
        <h2>Archivos Subidos</h2>
        <div id="fileList">
            <p>Cargando archivos...</p>
        </div>
        
        <a href="/" class="btn btn-primary mt-3">🏠 Volver al inicio</a>
    </div>

    <script>
        // Función para eliminar archivo
        function deleteFile(filename) {
            if (!confirm('¿Estás seguro de eliminar ' + filename + '?')) {
                return;
            }
            
            fetch('/autoindex/' + filename, {
                method: 'DELETE'
            })
            .then(response => response.text())
            .then(html => {
                alert('Archivo eliminado exitosamente');
                location.reload();
            })
            .catch(error => {
                alert('Error al eliminar el archivo');
            });
        }
        
        // Aquí deberías cargar dinámicamente los archivos
        // Por ahora mostramos un mensaje
        document.getElementById('fileList').innerHTML = 
            '<div class="alert alert-warning">Visita <a href="/autoindex/">/autoindex/</a> para ver los archivos con autoindex</div>';
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
